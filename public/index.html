<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI Blog Draft Generator — Demo</title>
    <style>
      :root {
        --accent: #2563eb;
        --muted: #6b7280;
        --card: #ffffff;
        --bg: #f8fafc;
        --mono-bg: #f3f4f6;
      }
      body {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial;
        margin: 28px;
        color: #111827;
      }
      h1 {
        font-size: 30px;
        margin-bottom: 8px;
      }
      p.lead {
        color: var(--muted);
        margin-top: 0;
        margin-bottom: 18px;
      }
      .input-row {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        margin-bottom: 16px;
      }
      input[type='text'] {
        flex: 1;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        font-size: 15px;
      }
      button {
        background: var(--accent);
        color: white;
        border: none;
        padding: 10px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .result {
        margin-top: 26px;
      }
      .card {
        background: var(--card);
        border: 1px solid #e6eefc;
        padding: 18px;
        border-radius: 10px;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.02);
      }
      #article {
        margin-top: 12px;
        padding: 18px;
        background: var(--bg);
        border-radius: 8px;
        border: 1px solid #eef2f7;
      }
      #metrics {
        background: var(--mono-bg);
        padding: 12px;
        border-radius: 8px;
        overflow: auto;
      }
      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.25);
        border-top-color: rgba(255, 255, 255, 0.9);
        animation: spin 1s linear infinite;
        vertical-align: middle;
        margin-right: 8px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .error {
        color: #b91c1c;
        margin-top: 12px;
      }
      .small {
        font-size: 13px;
        color: var(--muted);
      }
      pre {
        white-space: pre-wrap;
        word-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <h1>A Super Simple AI Blog Draft Generator</h1>
    <p class="lead">
      Demo running in <strong>Mock Mode</strong>. Enter a URL and click
      Generate.
    </p>

    <div class="input-row">
      <input
        id="url"
        type="text"
        placeholder="https://example.com/article"
        value=""
        aria-label="Competitor URL"
      />
      <button id="go">Generate</button>
    </div>

    <div class="small">Tip: press <kbd>Enter</kbd> to run.</div>

    <div id="error" class="error" style="display: none"></div>

    <div class="result">
      <div id="titleRow" style="display: none; margin-top: 18px">
        <h2 id="title"></h2>
      </div>

      <div id="articleCard" class="card" style="display: none">
        <div id="article"></div>
      </div>

      <h3 style="margin-top: 18px; display: none" id="metricsHeading">
        Metrics
      </h3>
      <pre id="metrics" style="display: none"></pre>
    </div>

    <script>
      // Configure endpoint here if needed
      const ENDPOINT = 'http://localhost:3000/generate';

      const MOCK_MODE = true;

      function mockGenerate(url) {
        return {
          title: 'AI-Generated Blog Draft',
          html: `
          <h2>Introduction</h2>
          <p>This is a mock-generated article based on the provided URL: ${escapeHtml(url)}.</p>
    
          <h2>Key Insights</h2>
          <p>The system extracts structure and generates original content while maintaining consistent tone and formatting.</p>
    
          <h2>Conclusion</h2>
          <p>This demonstrates how the pipeline produces structured, review-ready content safely and deterministically.</p>
        `,
          metrics: {
            originality: 0.91,
            word_count: 120,
          },
        };
      }

      const urlInput = document.getElementById('url');
      const goBtn = document.getElementById('go');
      const titleEl = document.getElementById('title');
      const titleRow = document.getElementById('titleRow');
      const articleEl = document.getElementById('article');
      const articleCard = document.getElementById('articleCard');
      const metricsEl = document.getElementById('metrics');
      const metricsHeading = document.getElementById('metricsHeading');
      const errorEl = document.getElementById('error');

      function setLoading(isLoading) {
        if (isLoading) {
          goBtn.disabled = true;
          goBtn.innerHTML =
            '<span class="spinner" aria-hidden="true"></span>Generating…';
        } else {
          goBtn.disabled = false;
          goBtn.textContent = 'Generate';
        }
      }

      function showError(msg) {
        errorEl.style.display = 'block';
        errorEl.textContent = String(msg || 'Unknown error');
      }

      function clearError() {
        errorEl.style.display = 'none';
        errorEl.textContent = '';
      }

      async function run() {
        clearError();
        titleRow.style.display = 'none';
        articleCard.style.display = 'none';
        metricsEl.style.display = 'none';
        metricsHeading.style.display = 'none';

        const url = urlInput.value.trim();
        if (!url) return showError('Please enter a valid URL.');

        setLoading(true);

        try {
          let json;

          if (MOCK_MODE) {
            json = mockGenerate(url);
          } else {
            const res = await fetch(ENDPOINT, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ url }),
            });

            json = await res.json();

            if (!res.ok) {
              throw new Error(json?.error || 'Request failed');
            }
          }

          if (!json) throw new Error('No response');

          // Title
          titleEl.textContent = json.title || '';

          // Article
          articleEl.innerHTML = json.html || '<p>No content</p>';

          // Metrics
          metricsEl.textContent = JSON.stringify(json.metrics || {}, null, 2);

          // Show UI
          titleRow.style.display = 'block';
          articleCard.style.display = 'block';
          metricsHeading.style.display = 'block';
          metricsEl.style.display = 'block';
        } catch (err) {
          console.error(err);
          showError(err.message || err);
        } finally {
          setLoading(false);
        }
      }

      // Escape helper for safety when injecting fallback text
      function escapeHtml(str) {
        return str.replace(/[&<>"']/g, function (m) {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
          }[m];
        });
      }

      // Enter to submit
      urlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          run();
        }
      });

      goBtn.addEventListener('click', run);

      // Demo convenience: prefill sample (optional — comment out if undesired)
      // urlInput.value = 'https://example.com/article-sample';

      // If you want to show endpoint in the UI console for clarity:
      console.log(`Demo UI loaded — will POST to ${ENDPOINT}`);
    </script>
  </body>
</html>
